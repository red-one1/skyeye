# Cloud speech recognition (OpenAI Whisper API) instead of local whisper.cpp: no model volume, no download,
# small resource requests. Needs SKYEYE_OPENAI_API_KEY in the Secret `skyeye`.
# Enable it by uncommenting `components: [components/openai-api]` in ../../kustomization.yaml.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: skyeye-models
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: skyeye
      spec:
        template:
          spec:
            initContainers:
              - name: fetch-model
                $patch: delete
            containers:
              - name: skyeye
                env:
                  # Environment variables override config.yaml, so whisper-model there is simply unused.
                  - {name: SKYEYE_RECOGNIZER, value: openai-whisper-api}
                resources:
                  requests: {cpu: 100m, memory: 256Mi}
                  limits: {memory: 1Gi}
                volumeMounts:
                  - mountPath: /models
                    $patch: delete
            volumes:
              - name: models
                $patch: delete
